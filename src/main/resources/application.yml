server:
  port: 5010
  tomcat:
    max-swallow-size: 500MB
    max-http-post-size: 500MB
  # servlet:
  #   context-path: /api  # ❌ Désactivé - les endpoints sont maintenant à la racine

spring:
  application:
    name: training-platform-api
  
  data:
    mongodb:
      uri: mongodb://mongo:DiGaBWUZXCkIxlZMuntztBaFJcOlUJIg@maglev.proxy.rlwy.net:40270/harx?authSource=admin
      database: harx
  
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
      file-size-threshold: 0
  
  security:
    user:
      name: admin
      password: admin

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey}
    expiration: ${JWT_EXPIRATION:86400000}
  
  cors:
    allowed-origins: ${CORS_ORIGIN:https://harxv25trainingplatformfrontend.netlify.app,https://harx25pageslinks.netlify.app}
  
  upload:
    directory: ${UPLOAD_DIR:uploads}
    max-size: ${MAX_FILE_SIZE:524288000}  # 500MB in bytes
  
  # AI Services Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      model: gpt-4
      temperature: 0.7
      max-tokens: 2000
    
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY}
      voice-id: 21m00Tcm4TlvDq8ikWAM
      model: eleven_monolingual_v1

  # Cloudinary Configuration
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dyqg8x26j}
    api-key: ${CLOUDINARY_API_KEY:981166483223979}
    api-secret: ${CLOUDINARY_API_SECRET:i3nxRvfOF1jjfLzMHKE8mP4aXVM}
    presets:
      training-images: ${CLOUDINARY_PRESET_FOR_TRAININGS_IMAGES:bf1katla}
      training-content: ${CLOUDINARY_PRESET_FOR_TRAININGS_CONTENT:hio38iac}
      mockcalls: ${CLOUDINARY_PRESET_FOR_MOCKCALLS:kuecaxbp}
    limits:
      image-size-mb: ${CLOUDINARY_IMAGE_LIMIT_SIZE_MB:10}
      document-size-mb: ${CLOUDINARY_DOCUMENT_LIMIT_SIZE_MB:50}
      video-size-mb: ${CLOUDINARY_VIDEO_LIMIT_SIZE_MB:100}
    
  # Google Cloud Vertex AI & Veo Configuration
  gcp:
    project-id: ${GOOGLE_CLOUD_PROJECT:harx-technologies-inc}
    location: ${GOOGLE_CLOUD_LOCATION:us-central1}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:./config/vertex-service-account.json}
    vertex-ai:
      model: ${VERTEX_AI_MODEL:gemini-1.5-flash}
      video-model: ${VERTEX_AI_VIDEO_MODEL:veo-001}
      podcast-model: ${VERTEX_AI_PODCAST_MODEL:gemini-1.5-pro}
    storage:
      bucket-name: ${GOOGLE_CLOUD_STORAGE_BUCKET:harx-training-media}

logging:
  level:
    com.trainingplatform: ${LOG_LEVEL:DEBUG}
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/training-platform.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always